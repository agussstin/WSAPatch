name: VlogEditor
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  VlogEditor:
    type: application
    platform: iOS
    sources: [VlogEditor]
    info:
      path: VlogEditor/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: Para elegir los videos que quieres editar.
        NSPhotoLibraryAddUsageDescription: Para guardar tu vlog editado en la galería.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.VlogEditor
